<html lang="en">
<head>

          content="
        default-src 'self';
        img-src 'self' data:;
        style-src 'self' 'unsafe-inline';
        script-src 'self' 'unsafe-inline';
        object-src 'none';
        base-uri 'none';
        frame-ancestors 'none';
      ">
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>UK Driving Theory Test - Complete DVSA Database (200+ Questions)</title>
    <script src="js/react.development.js"></script>
    <script src="js/react-dom.development.js"></script>
    <script src="data/questions_v1.js"></script>
    <script>
        // Keep the rest of your code unchanged: it still uses ALL_QUESTIONS
        const ALL_QUESTIONS = window.EDS_QUESTIONS;
    </script>

    <script src="js/babel.min.js"></script>
    <link href="tailwind.min.css" rel="stylesheet">
    <link href="app.css" rel="stylesheet">


    <!-- Preload readiness badge images (faster first paint) -->
    <link rel="preload" as="image" href="badges/badge_ready.webp" type="image/webp">
    <link rel="preload" as="image" href="badges/badge_almost.webp" type="image/webp">
    <link rel="preload" as="image" href="badges/badge_practice.webp" type="image/webp">

    <style>
        body { padding-top: env(safe-area-inset-top);
  padding-bottom: env(safe-area-inset-bottom);
  padding-left: env(safe-area-inset-left);
  padding-right: env(safe-area-inset-right); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif; }


/* Police-badge link wrapper */
.police-badge {
  display: inline-flex;
  align-items: center;
  gap: .5rem;
  text-decoration: none;
  padding: .35rem .6rem .35rem .4rem;
  border-radius: 9999px;              /* pill around the text */
  border: 1px solid rgba(0,0,0,.08);
  background: #fff;
  box-shadow: 0 1px 3px rgba(0,0,0,.08);
  font-size: .875rem;                 /* text-sm */
  line-height: 1.1;
}
.police-badge:hover { filter: brightness(0.98); }

/* The shield icon (CSS shape) */
.police-badge .shield {
  --badge: #1d4ed8;   /* default (low) */
  --star:  #ffffff;

  width: 28px; height: 34px; flex: 0 0 28px;
  display: grid; place-items: center;
  color: var(--star);
  background:
    radial-gradient(120% 120% at 30% 10%, rgba(255,255,255,.35), rgba(255,255,255,0) 40%),
    linear-gradient(180deg, rgba(255,255,255,.18), rgba(0,0,0,.12)),
    var(--badge);
  /* shield silhouette */
  -webkit-clip-path: polygon(50% 0%, 85% 12%, 100% 38%, 82% 86%, 50% 100%, 18% 86%, 0 38%, 15% 12%);
          clip-path: polygon(50% 0%, 85% 12%, 100% 38%, 82% 86%, 50% 100%, 18% 86%, 0 38%, 15% 12%);
  border: 1px solid rgba(0,0,0,.25);
  box-shadow: 0 1px 2px rgba(0,0,0,.25), inset 0 1px 2px rgba(255,255,255,.25);
  font-weight: 700;
  font-size: .9rem;  /* star size */
}

/* Tiers: colours switch by class on the wrapper */
.police-badge.badge-high .shield { --badge: #1e3a8a; --star: #f59e0b; }  /* deep blue + gold star */
.police-badge.badge-mid  .shield { --badge: #b45309; --star: #ffffff; }  /* amber */
.police-badge.badge-low  .shield { --badge: #3b82f6; --star: #ffffff; }  /* blue */

/* Optional: compact text on small screens */
@media (max-width:420px){
  .police-badge { font-size: .8rem; gap: .4rem; }
}
    </style>
</head>
<body>
<div class="page">
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect } = React;

        // Lucide React icons (simplified versions)
        const RotateCcw = ({ size = 24, className = "" }) => (
            <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
                <path d="M3 3v5h5"/>
            </svg>
        );

        const CheckCircle = ({ size = 24, className = "" }) => (
            <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                <path d="m9 11 3 3L22 4"/>
            </svg>
        );

        const XCircle = ({ size = 24, className = "" }) => (
            <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <circle cx="12" cy="12" r="10"/>
                <path d="m15 9-6 6"/>
                <path d="m9 9 6 6"/>
            </svg>
        );

        const Clock = ({ size = 24, className = "" }) => (
            <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <circle cx="12" cy="12" r="10"/>
                <path d="M12 6v6l4 2"/>
            </svg>
        );

        const Target = ({ size = 24, className = "" }) => (
            <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <circle cx="12" cy="12" r="10"/>
                <circle cx="12" cy="12" r="6"/>
                <circle cx="12" cy="12" r="2"/>
            </svg>
        );

        const BookOpen = ({ size = 24, className = "" }) => (
            <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
                <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
            </svg>
        );



        // Function to randomize answer options for each question
        const randomizeAnswerOptions = (question) => {
            const originalCorrectAnswer = question.options[question.correct];
            const shuffledOptions = [...question.options];

            // Fisher-Yates shuffle algorithm
            for (let i = shuffledOptions.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffledOptions[i], shuffledOptions[j]] = [shuffledOptions[j], shuffledOptions[i]];
            }

            // Find the new index of the correct answer
            const newCorrectIndex = shuffledOptions.findIndex(option => option === originalCorrectAnswer);

            return {
                ...question,
                options: shuffledOptions,
                correct: newCorrectIndex
            };
        };

        const DrivingTheoryTest = () => {
            const [questions, setQuestions] = useState([]);
            const [currentQuestionIndex, setCurrentQuestionIndex] = useState(0);
            const [selectedAnswers, setSelectedAnswers] = useState({});
            const [showResults, setShowResults] = useState(false);
            const [testStarted, setTestStarted] = useState(false);
            const [timeLeft, setTimeLeft] = useState(57 * 60); // 57 minutes in seconds
            const [selectedCategories, setSelectedCategories] = useState([]);
            const [showCategoryFilter, setShowCategoryFilter] = useState(false);

            // Get unique categories
            const categories = [...new Set(ALL_QUESTIONS.map(q => q.category))];

            // Timer effect
            useEffect(() => {
                if (testStarted && !showResults && timeLeft > 0) {
                    const timer = setInterval(() => {
                        setTimeLeft(prev => {
                            if (prev <= 1) {
                                handleSubmitTest();
                                return 0;
                            }
                            return prev - 1;
                        });
                    }, 1000);
                    return () => clearInterval(timer);
                }
            }, [testStarted, showResults, timeLeft]);

            const formatTime = (seconds) => {
                const mins = Math.floor(seconds / 60);
                const secs = seconds % 60;
                return `${mins}:${secs.toString().padStart(2, '0')}`;
            };

            const shuffleQuestions = (questionsArray) => {
                // First randomize the answer options for each question
                const randomizedQuestions = questionsArray.map(randomizeAnswerOptions);

                // Then shuffle the questions themselves
                const shuffled = [...randomizedQuestions];
                for (let i = shuffled.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
                }
                return shuffled.slice(0, 50); // Take 50 questions for full test
            };

            const getFilteredQuestions = () => {
                if (selectedCategories.length === 0) {
                    return ALL_QUESTIONS;
                }
                return ALL_QUESTIONS.filter(q => selectedCategories.includes(q.category));
            };

            const startTest = () => {
                const availableQuestions = getFilteredQuestions();
                if (availableQuestions.length === 0) {
                    alert("Please select at least one category");
                    return;
                }

                const shuffledQuestions = shuffleQuestions(availableQuestions);
                setQuestions(shuffledQuestions);
                setTestStarted(true);
                setCurrentQuestionIndex(0);
                setSelectedAnswers({});
                setShowResults(false);
                setTimeLeft(57 * 60);
            };

            const handleCategoryToggle = (category) => {
                setSelectedCategories(prev =>
                    prev.includes(category)
                        ? prev.filter(c => c !== category)
                        : [...prev, category]
                );
            };

            const selectAllCategories = () => {
                setSelectedCategories(categories);
            };

            const clearAllCategories = () => {
                setSelectedCategories([]);
            };

            const handleAnswerSelect = (answerIndex) => {
                setSelectedAnswers(prev => ({
                    ...prev,
                    [currentQuestionIndex]: answerIndex
                }));
            };

            const handleNextQuestion = () => {
                if (currentQuestionIndex < questions.length - 1) {
                    setCurrentQuestionIndex(prev => prev + 1);
                }
            };

            const handlePreviousQuestion = () => {
                if (currentQuestionIndex > 0) {
                    setCurrentQuestionIndex(prev => prev - 1);
                }
            };

            const handleSubmitTest = () => {
                setShowResults(true);
                setTestStarted(false);
            };

            const calculateScore = () => {
                let correct = 0;
                questions.forEach((question, index) => {
                    if (selectedAnswers[index] === question.correct) {
                        correct++;
                    }
                });
                return correct;
            };

            const resetTest = () => {
                setTestStarted(false);
                setShowResults(false);
                setCurrentQuestionIndex(0);
                setSelectedAnswers({});
                setTimeLeft(57 * 60);
            };

            const getCategoryStats = () => {
                const stats = {};
                questions.forEach((question, index) => {
                    const category = question.category;
                    if (!stats[category]) {
                        stats[category] = { total: 0, correct: 0 };
                    }
                    stats[category].total++;
                    if (selectedAnswers[index] === question.correct) {
                        stats[category].correct++;
                    }
                });
                return stats;
            };

            if (!testStarted && !showResults) {
                return (
                    <div className="max-w-4xl mx-auto p-6 bg-white min-h-screen">
                        <div className="text-center mb-8">


                            <h1 className="text-3xl font-bold text-blue-900 mb-2">UK Driving Theory Test</h1>
                            <p className="text-gray-600">Complete DVSA Question Database - {ALL_QUESTIONS.length} Questions</p>
                            <p className="text-sm text-gray-500 mt-1">Comprehensive practice test with randomized answer options</p>
                        </div>

                        <div className="bg-green-50 border border-green-200 rounded-lg p-6 mb-6">
                            <h2 className="text-xl font-semibold text-green-900 mb-4">✨ Randomized Answer Options</h2>
                            <p className="text-gray-700">
                                Each time you start a test, <strong>all answer options are randomly shuffled</strong> so the correct answer
                                is distributed evenly across A, B, C, and D options. This makes the test more realistic and prevents
                                memorizing answer patterns.
                            </p>
                        </div>

                        <div className="bg-blue-50 border border-blue-200 rounded-lg p-6 mb-6">
                            <h2 className="text-xl font-semibold text-blue-900 mb-4 flex items-center">
                                <BookOpen className="mr-2" />
                                Question Categories ({categories.length} categories available)
                            </h2>
                            <div className="flex gap-2 mb-4">
                                <button
                                    onClick={() => setShowCategoryFilter(!showCategoryFilter)}
                                    className="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors"
                                >
                                    {showCategoryFilter ? 'Hide' : 'Show'} Category Filter
                                </button>
                                {showCategoryFilter && (
                                    <>
                                        <button
                                            onClick={selectAllCategories}
                                            className="px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 transition-colors"
                                        >
                                            Select All
                                        </button>
                                        <button
                                            onClick={clearAllCategories}
                                            className="px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 transition-colors"
                                        >
                                            Clear All
                                        </button>
                                    </>
                                )}
                            </div>

                            {showCategoryFilter && (
                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3 mb-4">
                                    {categories.map(category => {
                                        const categoryCount = ALL_QUESTIONS.filter(q => q.category === category).length;
                                        return (
                                            <label key={category} className="flex items-center space-x-2 cursor-pointer p-2 hover:bg-blue-100 rounded">
                                                <input
                                                    type="checkbox"
                                                    checked={selectedCategories.includes(category)}
                                                    onChange={() => handleCategoryToggle(category)}
                                                    className="w-4 h-4 text-blue-600 rounded"
                                                />
                                                <span className="text-sm text-gray-700 flex-1">
                                                    {category} ({categoryCount})
                                                </span>
                                            </label>
                                        );
                                    })}
                                </div>
                            )}

                            <div className="text-sm text-gray-600 bg-blue-100 p-3 rounded">
                                <strong>Available questions:</strong> {getFilteredQuestions().length}
                                {selectedCategories.length > 0 && (
                                    <span className="ml-2">
                                        (from {selectedCategories.length} selected categories)
                                    </span>
                                )}
                            </div>
                        </div>

                        <div className="bg-gray-50 border border-gray-200 rounded-lg p-6 mb-6">
                            <h2 className="text-xl font-semibold text-gray-900 mb-4">Test Information</h2>
                            <div className="grid md:grid-cols-3 gap-4">
                                <div className="flex items-center">
                                    <Target className="text-blue-600 mr-2" />
                                    <div>
                                        <p className="font-medium">Questions</p>
                                        <p className="text-sm text-gray-600">50 questions per test</p>
                                    </div>
                                </div>
                                <div className="flex items-center">
                                    <Clock className="text-blue-600 mr-2" />
                                    <div>
                                        <p className="font-medium">Time Limit</p>
                                        <p className="text-sm text-gray-600">57 minutes</p>
                                    </div>
                                </div>
                                <div className="flex items-center">
                                    <CheckCircle className="text-green-600 mr-2" />
                                    <div>
                                        <p className="font-medium">Pass Mark</p>
                                        <p className="text-sm text-gray-600">43 out of 50 (86%)</p>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div className="text-center">
                        {/* New Back Button */}
                            <button
                                onClick={() => window.history.back()}
                                className="bg-gray-500 hover:bg-gray-600 text-white font-bold py-3 px-6 rounded-lg text-lg transition-colors mr-4"
                            >
                                Back
                            </button>
                            <button
                                onClick={startTest}
                                disabled={getFilteredQuestions().length === 0}
                                className="bg-blue-600 hover:bg-blue-700 disabled:bg-gray-400 disabled:cursor-not-allowed text-white font-bold py-4 px-8 rounded-lg text-lg transition-colors"
                            >
                                Start Theory Test
                            </button>
                            <p className="text-sm text-gray-600 mt-2">
                                {selectedCategories.length === 0
                                    ? `Using all ${ALL_QUESTIONS.length} questions from all categories`
                                    : `Using ${getFilteredQuestions().length} questions from ${selectedCategories.length} selected categories`
                                }
                            </p><p><br></br></p><p><br></br></p>
                        </div>
                    </div>
                );
            }

            if (showResults) {
                const score = calculateScore();
                const passed = score >= 43;
                const categoryStats = getCategoryStats();

                return (
                    <div className="max-w-4xl mx-auto p-6 bg-white min-h-screen">
                        <div className="text-center mb-8">
                            <h1 className="text-3xl font-bold text-blue-900 mb-4">Test Results</h1>

                            <div className={`inline-flex items-center justify-center w-32 h-32 rounded-full mb-6 ${
                                passed ? 'bg-green-100 text-green-600' : 'bg-red-100 text-red-600'
                            }`}>
                                {passed ? <CheckCircle size={48} /> : <XCircle size={48} />}
                            </div>

                            <h2 className={`text-4xl font-bold mb-2 ${passed ? 'text-green-600' : 'text-red-600'}`}>
                                {passed ? 'PASS' : 'FAIL'}
                            </h2>

                            <p className="text-2xl text-gray-700 mb-6">
                                {score} out of {questions.length} correct ({Math.round((score / questions.length) * 100)}%)
                            </p>

                            <div className="bg-gray-50 rounded-lg p-4 mb-6">
                                <p className="text-gray-600">
                                    {passed ?
                                        'Congratulations! You passed the theory test. You\'re ready for the real exam!' :
                                        `You need 43 correct answers to pass. You scored ${score} - keep practicing!`
                                    }
                                </p>
                            </div>
                        </div>

    {/* Readiness badge (image) — paste above the Share row block */}
    {(() => {
    const BOOK_URL = "https://www.gov.uk/book-theory-test";

    // Current score
    const percentage = Math.round((score / questions.length) * 100);

    // Persist one result (guard against double-saves on quick re-renders)
    try {
    const key = "mockHistory";
    const history = JSON.parse(localStorage.getItem(key) || "[]");
    const last = history[history.length - 1];
    const recent = last && last.total === questions.length && last.pct === percentage && (Date.now() - last.ts) < 60000;
    if (!recent) {
      history.push({ ts: Date.now(), score, total: questions.length, pct: percentage });
      localStorage.setItem(key, JSON.stringify(history.slice(-20)));
    }
    } catch (_) {}

    // Compute last-5 average
    let avg = percentage;
    try {
    const h = JSON.parse(localStorage.getItem("mockHistory") || "[]");
    const last5 = h.slice(-5);
    if (last5.length) avg = Math.round(last5.reduce((a,b)=>a + (b.pct||0), 0) / last5.length);
    } catch (_) {}

    // Tier and label
    const tier = avg >= 90 ? "high" : avg >= 80 ? "mid" : "low";
    const label = `${tier === "high" ? "Ready to book" : tier === "mid" ? "Almost there" : "Keep practising"} • last avg ${avg}%`;

    // Pick the WebP badge image
    const src = {
    high: "badges/badge_ready.webp",
    mid:  "badges/badge_almost.webp",
    low:  "badges/badge_practice.webp",
    }[tier] || "badges/badge_practice.webp";

    const Badge = (
    <span className="inline-flex items-center gap-3">
      <img src={src} alt={label} width="72" height="88" loading="lazy" style={{ height: "88px", width: "auto" }} />
      <span className="text-sm text-gray-800">{label}</span>
    </span>
    );

    return (
    <div className="mt-2 mb-4 text-center">
      {tier === "high"
        ? <a href={BOOK_URL} target="_blank" rel="noopener" className="hover:opacity-90">{Badge}</a>
        : Badge}
      <div className="text-xs text-gray-500 mt-1">Based on your last 5 mocks</div>
    </div>
    );
    })()}

    {/* Share row — compact and above Category Performance */}
    {(() => {
    const percentage = Math.round((score / questions.length) * 100);
    const shareUrl = "https://play.google.com/store/apps/details?id=com.james.murrell.edstheorytest";
    const shareText = `I just ${passed ? "passed" : "took"} a UK Theory mock: ${score}/${questions.length} (${percentage}%). Try the same free app: ${shareUrl}`;

    const handleNativeShare = async () => {
    try {
      if (navigator.share) {
        await navigator.share({ title: "UK Theory Test – Free", text: shareText, url: shareUrl });
      } else {
        // Fallback: copy to clipboard
        await navigator.clipboard.writeText(shareText);
        const el = document.getElementById("shareCopiedNote");
        if (el) { el.classList.remove("hidden"); setTimeout(() => el.classList.add("hidden"), 1800); }
      }
    } catch (_) {/* user cancelled */}
    };

    const handleCopy = async () => {
    await navigator.clipboard.writeText(shareText);
    const el = document.getElementById("shareCopiedNote");
    if (el) { el.classList.remove("hidden"); setTimeout(() => el.classList.add("hidden"), 1800); }
    };

    const waHref = `https://wa.me/?text=${encodeURIComponent(shareText)}`;
    const xHref = `https://x.com/intent/tweet?text=${encodeURIComponent(shareText)}`;

    return (
    <div className="mb-6">
      <div className="text-sm text-gray-600 text-center mb-2">Share your score</div>
      <div className="flex flex-wrap justify-center gap-2">
        <button
          onClick={handleNativeShare}
          className="inline-flex items-center px-3 py-1.5 rounded-md bg-blue-600 text-white hover:bg-blue-700 transition"
        >
          Share
        </button>
        <a
          href={waHref}
          target="_blank" rel="noopener"
          className="inline-flex items-center px-3 py-1.5 rounded-md bg-green-600 text-white hover:bg-green-700 transition"
        >
          WhatsApp
        </a>
        <a
          href={xHref}
          target="_blank" rel="noopener"
          className="inline-flex items-center px-3 py-1.5 rounded-md bg-gray-800 text-white hover:bg-black transition"
        >
          Post on X
        </a>
        <button
          onClick={handleCopy}
          className="inline-flex items-center px-3 py-1.5 rounded-md bg-gray-200 text-gray-800 hover:bg-gray-300 transition"
        >
          Copy link
        </button>
      </div>
      <p id="shareCopiedNote" className="hidden text-center text-xs text-green-600 mt-2">Copied to clipboard</p>
    </div>
    );
    })()}

                        {/* Category Performance */}
                        {Object.keys(categoryStats).length > 1 && (
                            <div className="mb-8">
                                <h3 className="text-xl font-semibold mb-4">Performance by Category</h3>
                                <div className="grid md:grid-cols-2 gap-4">
                                    {Object.entries(categoryStats).map(([category, stats]) => (
                                        <div key={category} className="bg-gray-50 rounded-lg p-4">
                                            <h4 className="font-medium text-gray-900 mb-2">{category}</h4>
                                            <div className="flex items-center justify-between">
                                                <span className="text-sm text-gray-600">
                                                    {stats.correct} / {stats.total} correct
                                                </span>
                                                <span className={`text-sm font-medium ${
                                                    stats.correct / stats.total >= 0.8 ? 'text-green-600' :
                                                    stats.correct / stats.total >= 0.6 ? 'text-yellow-600' : 'text-red-600'
                                                }`}>
                                                    {Math.round((stats.correct / stats.total) * 100)}%
                                                </span>
                                            </div>
                                            <div className="w-full bg-gray-200 rounded-full h-2 mt-2">
                                                <div
                                                    className={`h-2 rounded-full ${
                                                        stats.correct / stats.total >= 0.8 ? 'bg-green-500' :
                                                        stats.correct / stats.total >= 0.6 ? 'bg-yellow-500' : 'bg-red-500'
                                                    }`}
                                                    style={{ width: `${(stats.correct / stats.total) * 100}%` }}
                                                ></div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* Review Questions */}
                        <div className="mb-8">
                            <h3 className="text-xl font-semibold mb-4">Review Your Answers</h3>
                            <div className="space-y-4">
                                {questions.map((question, index) => {
                                    const userAnswer = selectedAnswers[index];
                                    const isCorrect = userAnswer === question.correct;

                                    return (
                                        <div key={index} className={`border rounded-lg p-4 ${
                                            isCorrect ? 'border-green-200 bg-green-50' : 'border-red-200 bg-red-50'
                                        }`}>
                                            <div className="flex items-start">
                                                <div className={`mr-3 mt-1 ${isCorrect ? 'text-green-600' : 'text-red-600'}`}>
                                                    {isCorrect ? <CheckCircle size={20} /> : <XCircle size={20} />}
                                                </div>
                                                <div className="flex-1">
                                                    <div className="flex items-center justify-between mb-2">
                                                        <p className="font-medium">Q{index + 1}: {question.question}</p>
                                                        <span className="ml-2 px-2 py-1 text-xs bg-blue-100 text-blue-800 rounded">
                                                            {question.category}
                                                        </span>
                                                    </div>
                                                    <div className="grid grid-cols-1 gap-2 mb-3">
                                                        {question.options.map((option, optIndex) => (
                                                            <div key={optIndex} className={`p-2 rounded text-sm ${
                                                                optIndex === question.correct ? 'bg-green-100 text-green-800 font-medium' :
                                                                optIndex === userAnswer && userAnswer !== question.correct ? 'bg-red-100 text-red-800' :
                                                                'bg-gray-100 text-gray-600'
                                                            }`}>
                                                                {String.fromCharCode(65 + optIndex)}) {option}
                                                                {optIndex === question.correct && <span className="ml-2 text-green-600">✓ Correct</span>}
                                                                {optIndex === userAnswer && userAnswer !== question.correct && <span className="ml-2 text-red-600">✗ Your answer</span>}
                                                            </div>
                                                        ))}
                                                    </div>
                                                    {question.explanation && (
                                                        <div className="mt-3 p-3 bg-blue-50 border border-blue-200 rounded text-sm text-blue-800">
                                                            <strong>Explanation:</strong> {question.explanation}
                                                        </div>
                                                    )}
                                                </div>
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        </div>

                        <div className="text-center">
                            <button
                                onClick={resetTest}
                                className="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-lg transition-colors inline-flex items-center"
                            >
                                <RotateCcw className="mr-2" size={20} />
                                Take Another Test
                            </button>
                        </div>
                    </div>
                );
            }

            const currentQuestion = questions[currentQuestionIndex];
            const progress = ((currentQuestionIndex + 1) / questions.length) * 100;

            return (
                <div className="max-w-4xl mx-auto p-6 bg-white min-h-screen">
                    <div className="mb-6">
                        <div className="flex justify-between items-center mb-4">
                            <h1 className="text-2xl font-bold text-blue-900">UK Driving Theory Test</h1>
                            <div className="flex items-center text-lg font-medium text-gray-700">
                                <Clock className="mr-2" size={20} />
                                <span className={timeLeft < 300 ? 'text-red-600' : ''}>
                                    {formatTime(timeLeft)}
                                </span>
                            </div>
                        </div>

                        <div className="bg-gray-200 rounded-full h-2 mb-4">
                            <div
                                className="bg-blue-600 h-2 rounded-full transition-all duration-300"
                                style={{ width: `${progress}%` }}
                            ></div>
                        </div>

                        <div className="flex justify-between items-center">
                            <p className="text-gray-600">
                                Question {currentQuestionIndex + 1} of {questions.length}
                            </p>
                            <span className="px-2 py-1 text-xs bg-blue-100 text-blue-800 rounded">
                                {currentQuestion.category}
                            </span>
                        </div>
                    </div>

                    <div className="bg-white border border-gray-200 rounded-lg p-6 mb-6">
                        <h2 className="text-xl font-medium text-gray-900 mb-6">
                            {currentQuestion.question}
                        </h2>

                        <div className="space-y-3">
                            {currentQuestion.options.map((option, index) => (
                                <button
                                    key={index}
                                    onClick={() => handleAnswerSelect(index)}
                                    className={`w-full text-left p-4 rounded-lg border-2 transition-colors ${
                                        selectedAnswers[currentQuestionIndex] === index
                                            ? 'border-blue-500 bg-blue-50 text-blue-900'
                                            : 'border-gray-200 hover:border-gray-300 hover:bg-gray-50'
                                    }`}
                                >
                                    <span className="font-medium mr-3">
                                        {String.fromCharCode(65 + index)})
                                    </span>
                                    {option}
                                </button>
                            ))}
                        </div>
                    </div>

                    <div className="flex justify-between items-center">
                        <button
                            onClick={handlePreviousQuestion}
                            disabled={currentQuestionIndex === 0}
                            className="px-6 py-2 bg-gray-200 text-gray-700 rounded-lg disabled:opacity-50 disabled:cursor-not-allowed hover:bg-gray-300 transition-colors"
                        >
                            Previous
                        </button>

                        <div className="flex space-x-3">
                            {currentQuestionIndex === questions.length - 1 ? (
                                <button
                                    onClick={handleSubmitTest}
                                    className="px-6 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 transition-colors"
                                >
                                    Submit Test
                                </button>
                            ) : (
                                <button
                                    onClick={handleNextQuestion}
                                    className="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors"
                                >
                                    Next
                                </button>
                            )}
                        </div>
                    </div>

                    <div className="mt-6 p-4 bg-gray-50 rounded-lg">
                        <div className="flex justify-between items-center text-sm text-gray-600">
                            <span>
                                Answered: {Object.keys(selectedAnswers).length} / {questions.length} questions
                            </span>
                            <span>
                                Progress: {Math.round(progress)}%
                            </span>
                        </div>
                    </div>
                </div>
            );
        };

        ReactDOM.render(<DrivingTheoryTest />, document.getElementById('root'));
    </script>

    <p><br></p></div>
</body>
</html>
